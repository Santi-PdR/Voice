plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = mod_group
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ONNX Runtime + JLayer must travel with the mod so the player/server does not
// need to install Java libraries manually. Forge Jar-in-Jar loads them safely.
jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'DEBUG'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'DEBUG'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    minecraftLibrary "com.microsoft.onnxruntime:onnxruntime:1.24.3"
    minecraftLibrary "javazoom:jlayer:1.0.1"

    jarJar(group: 'com.microsoft.onnxruntime', name: 'onnxruntime', version: '[1.24.3,1.25)') {
        jarJar.pin(it, '1.24.3')
    }
    jarJar(group: 'javazoom', name: 'jlayer', version: '[1.0.1,1.1)') {
        jarJar.pin(it, '1.0.1')
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: '[1.20,1.21)',
            forge_version: forge_version, forge_version_range: '[47,)',
            mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The normal jar is kept as a slim diagnostic artifact; the distributable jar
// is the Jar-in-Jar output containing ONNX Runtime and JLayer.
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
}

tasks.named('build').configure {
    dependsOn tasks.named('jarJar')
}
